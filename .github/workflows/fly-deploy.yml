name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths-ignore: ["data/probe/**", "tools/**", ".github/workflows/probe.yml"]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Fly is connected
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::notice::No FLY_API_TOKEN secret yet; not deploying."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.go == 'yes'
      - name: Deploy
        if: steps.gate.outputs.go == 'yes'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
