name: Collect official Nixon transcripts

on:
  workflow_dispatch:
    inputs:
      debug:
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pypdf
      - run: python tools/fetch_official_transcripts.py
      - name: Commit
        run: |
          git config user.name "archivehunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nixon_transcripts.json.gz
          git diff --cached --quiet && exit 0
          git commit -m "Official Nixon tape transcripts"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
