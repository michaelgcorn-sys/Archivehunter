name: Refresh Top Secret pool

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"        # daily

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pypdf pillow
      - run: python tools/build_top_secret.py
      - name: Commit
        run: |
          git config user.name "archivehunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/top_secret_pool.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily Top Secret pool"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
