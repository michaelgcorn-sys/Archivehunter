name: Probe (debug helper)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path of a python script in tools/probes/ to run"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pypdf pillow
      - run: python "tools/probes/${{ github.event.inputs.script }}"
      - name: Save probe output (if any)
        run: |
          git config user.name "archivehunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "probe output"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
