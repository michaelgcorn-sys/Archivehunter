name: Build Nixon tape log index

on:
  workflow_dispatch:
    inputs:
      first:
        description: "First tape (blank = all)"
        required: false
      last:
        description: "Last tape"
        required: false
  schedule:
    - cron: "17 7 1 * *"        # monthly refresh, 1st of the month

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          pip install -q requests pypdf pypdfium2 pytesseract pillow
      - name: Build index
        run: python tools/build_nixon_index.py ${{ github.event.inputs.first }} ${{ github.event.inputs.last }}
      - name: Commit index
        run: |
          git config user.name "archivehunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nixon_logs.json.gz
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Update Nixon tape log index"
          git pull --rebase origin main && git push origin HEAD:main
